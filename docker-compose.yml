version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hr-dashboard-db
    environment:
      POSTGRES_DB: hrdashboard
      POSTGRES_USER: hrdashboard_user
      POSTGRES_PASSWORD: hrdashboard_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrdashboard_user -d hrdashboard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
