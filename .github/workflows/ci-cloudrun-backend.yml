name: Deploy to Google Cloud Run for Staging

on:
    pull_request:
        branches: ['staging']
        paths: 
          - '.github/workflows/ci-cloudrun-backend.yml'
          - 'backend/**'
    push:
        branches: ['staging']
        paths: 
          - '.github/workflows/ci-cloudrun-backend.yml'
          - 'backend/**'

jobs:
    setup-build-publish-deploy:
        name: Setup, Build, Publish, Deploy
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              id: auth
              uses: google-github-actions/auth@v2
              with:
                credentials_json: ${{ secrets.GCP_DEPLOYER_SA }}

            - name: Set Up Google Cloud SDK
              uses: google-github-actions/setup-gcloud@v2.0.0
              with:
                project_id: ${{ secrets.GCP_PROJECT_ID }}

            - name: Authenticate Docker
              run: gcloud auth configure-docker ${{ vars.GCP_REPO_REGION }}-docker.pkg.dev --quiet

            - name: Build Docker Image
              working-directory: ./backend
              run: docker build --no-cache --tag ${{ vars.GCP_REPO_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/hr-dashboard/hr-dashboard-be:${{ github.sha }} .

            - name: Push image to Artifact Registry
              run: docker push ${{ vars.GCP_REPO_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/hr-dashboard/hr-dashboard-be:${{ github.sha }}

            - name: Deploy image to Google Cloud Run
              run: |
                gcloud run deploy hr-dashboard-be \
                  --image=${{ vars.GCP_REPO_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/hr-dashboard/hr-dashboard-be:${{ github.sha }} \
                  --platform=managed \
                  --region=${{ vars.GCP_CLOUD_RUN_REGION }} \
                  --allow-unauthenticated \
                  --service-account=${{ secrets.CLOUD_RUN_RUNTIME_SA_EMAIL }} \
                  --network=default \
                  --subnet=default \
                  --vpc-egress=private-ranges-only \
                  --port=5000 \
                  --min-instances=0 \
                  --max-instances=2 \
                  --set-env-vars=DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }} \
                  --set-env-vars=DIRECT_URL=${{ secrets.STAGING_DIRECT_URL }} \
                  --set-env-vars=ACCESS_TOKEN_SECRET=${{ secrets.STAGING_ACCESS_TOKEN_SECRET }} \
                  --set-env-vars=REFRESH_TOKEN_SECRET=${{ secrets.STAGING_REFRESH_TOKEN_SECRET }} \
                  --set-env-vars=ACCESS_TOKEN_DURATION=${{ vars.STAGING_ACCESS_TOKEN_DURATION }} \
                  --set-env-vars=REFRESH_TOKEN_DURATION=${{ vars.STAGING_REFRESH_TOKEN_DURATION }} \
                  --set-env-vars=GCS_BUCKET_NAME=${{ vars.STAGING_GCS_BUCKET_NAME }} \
                  --set-env-vars=NODE_ENV=staging